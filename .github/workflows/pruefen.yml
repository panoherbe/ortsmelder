name: Prüfen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Alle Prüfungen in Containern
        run: ./pruefen.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruefung
          path: pruefung/
          if-no-files-found: ignore
